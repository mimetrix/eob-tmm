# Isolated build-box fixture. Explicit project name prevents overlap with other tests.
# The TMM image is reused; this file does not change or rebuild TMM source.
name: eob-dlp-20260924

services:
  fixture:
    image: artifactory.f5net.com/f5-tmm-docker/f5-tmm-test-image/tao@sha256:b90de5cbafe343f4d0b06abcdb2f82af8a1b46a23b208da8a2a6acc1f3f8894c
    entrypoint: [/bin/bash, /work/icap-bootstrap.sh]
    environment:
      DEPLOYMENT: development
      MODULAR_BIP_URL: https://artifactory.f5net.com/artifactory/f5-apis-npm/@f5-apis/mbip-apis-pb/-/@f5-apis/mbip-apis-pb-303.43.0.tgz
      WITH_GRPC: "false"
      CONF_TRANSPORT: nats-tls
      NATS_CERTS_PATH: /package/nats_certs
      ICB_ASYNCAPI_PROTO_VERSION: v2
      PYTHONUNBUFFERED: "1"
      # NATS is asynchronous; its send call has no synchronous DPC return value.
      CONFIG_SERVER_DPC_RAISE_ON_ERROR: "false"
      ICAP_VIP: ${ICAP_VIP:-10.203.72.50}
      ICAP_BACKEND: ${ICAP_BACKEND:-10.203.72.11}
    volumes:
      - nats-certs:/package/nats_certs/tmm
      - .:/work:ro
      - evidence:/evidence
    networks:
      management:
        ipv4_address: ${FIXTURE_MANAGEMENT_IP:-10.203.71.11}
        priority: 100
      data:
        ipv4_address: ${FIXTURE_DATA_IP:-10.203.72.11}
        priority: 50
    cap_add: [NET_ADMIN]
    healthcheck:
      test: [CMD-SHELL, "test -f /package/nats_certs/tmm/ca.pem && test -f /package/proto/package/py/profile_responseadapt_pb2.py"]
      interval: 2s
      timeout: 2s
      retries: 90

  tmm:
    image: tmm:CATALOGFREE-20260924
    pull_policy: never
    entrypoint: [/opt/bin/init.tmm.sh]
    privileged: true
    init: true
    mem_limit: 4g
    depends_on:
      fixture:
        condition: service_healthy
    environment:
      CONF_TRANSPORT: nats-tls
      PAL_CPU_SET: 0-0
      TMM_MAPRES_IGNORE_MEM_LIMIT: "yes"
      TMM_IGNORE_MEM_LIMIT: "yes"
      TMM_MAPRES_NO_IPV6_RULES: "yes"
      TMM_ENFORCE_LICENSING: "false"
      ENABLE_TMROUTED_PROXY: "false"
      SESSIONDB_EXTERNAL_STORAGE: "FALSE"
      MSG_BUS_ADDR: fixture
      MSG_BUS_PORT: "4222"
      MSG_BUS_USER: tmm
      MSG_BUS_PASS: insecure_password_tmm
      CONFIG_SUBJECT: internal-config
      PUBLISH_SUBJECT: dataplane-client
      PROCESS_NAME: TMM
      TMM_QUERY_INTERVAL_SECS: "120"
      NATS_TLS_AUTH_CERT: /opt/f5/mbip/fsm/certificates/f5-fsm-tmm.pem
      NATS_TLS_AUTH_KEY: /opt/f5/mbip/fsm/certificates/f5-fsm-tmm-key.pem
      NATS_TLS_CA_FILE: /opt/f5/mbip/fsm/certificates/ca.pem
      LS_SHIELD_BUILTIN: "0"
      LS_VM_SELFTEST: "0"
      LS_SHIELD_MODE: monitor
      LS_VM_JIT: "1"
      LS_VM_TIMING: "1"
      LS_VM_SAMPLES: "true"
      LS_VM_VERBOSE: "1"
      LS_TP_RING: /dev/shm/ls_tp_ring
      LS_LOAD_SOCKET: /tmp/ls_load.sock
    volumes:
      - nats-certs:/opt/f5/mbip/fsm/certificates:ro
    networks:
      management:
        ipv4_address: ${TMM_MANAGEMENT_IP:-10.203.71.10}
        priority: 100
      data:
        ipv4_address: ${TMM_DATA_IP:-10.203.72.10}
        priority: 50

networks:
  management:
    ipam:
      config:
        - subnet: ${MANAGEMENT_SUBNET:-10.203.71.0/24}
  data:
    ipam:
      config:
        - subnet: ${DATA_SUBNET:-10.203.72.0/24}

volumes:
  nats-certs:
  evidence:
